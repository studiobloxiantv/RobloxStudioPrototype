<style>

#tabs{display:flex;background:var(--p)}#tabs div{padding:7px 14px;color:var(--m);font-weight:600;font-size:12px}

.btn.on{background:var(--a);border-color:var(--a)}.btn i{display:block;font-style:normal;font-size:16px}

#tb:not([hidden]){display:grid}#tb .btn{padding:10px 4px}

<script>
const $=s=>document.querySelector(s),VP=$('#vp');
const R=new THREE.WebGLRenderer({antialias:true});VP.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x9fcdf5);
const C=new THREE.PerspectiveCamera(60,1,.1,3000);
S.add(new THREE.HemisphereLight(0xffffff,0x667788,.95));const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(50,100,30);S.add(sun);

// ---------- 3D Drag Gizmo (Move & Scale Handles) ----------
const gz=new THREE.Group();gz.visible=false;S.add(gz);
const gzHits=[];
const AXES=[
 {a:0,s:1,d:[1,0,0],c:0xff3b30},{a:0,s:-1,d:[-1,0,0],c:0xff3b30},
 {a:1,s:1,d:[0,1,0],c:0x34c759},{a:1,s:-1,d:[0,-1,0],c:0x34c759},

];
const gCone=new THREE.ConeGeometry(.26,.72,14);

AXES.forEach(x=>{
 const g=new THREE.Group(),dir=new THREE.Vector3(...x.d);

 const moveTip=new THREE.Mesh(gCone,mat);moveTip.position.y=1.18;moveTip.renderOrder=999;

function updGizmo(){

}
let drag=null;
function ray(e){
 const r=el.getBoundingClientRect(),rc=new THREE.Raycaster();

function ins(o){const h=(o.size||[4,1,2])[1]/2;select(add(Object.assign({pos:[Math.round(T.x),h,Math.round(T.z)]},o)))}

  a({name:'FrontL',color:w,size:[6,10,1],pos:[x-5,6,z+7.5]});a({name:'FrontR',color:w,size:[6,10,1],pos:[x+5,6,z+7.5]});
  a({name:'Lintel',color:w,size:[4,3,1],pos:[x,9.5,z+7.5]});a({name:'Roof',color:'#8a3b3b',size:[18,1,18],pos:[x,11.5,z]})}

const TB=[['▭','Part',()=>ins({})],['●','Ball',()=>ins({name:'Ball',shape:'ball',size:[4,4,4]})],['⬮','Cylinder',()=>ins({name:'Cylinder',shape:'cyl',size:[4,2,2]})],
 ['⚑','SpawnLocation',()=>ins({name:'SpawnLocation',spawn:true,size:[6,1,6]})],['🌲','Tree',()=>grp('Tree')],['🏠','House',()=>grp('House')]];
$('#tb').innerHTML=TB.map((t,i)=>`<div class=btn data-t=${i}><i>${t[0]}</i>${t[1]}</div>`).join('');
$('#tb').onclick=e=>{const b=e.target.closest('[data-t]');if(b)TB[b.dataset.t][2]()};
function del(){if(!sel)return;S.remove(sel.mesh);parts=parts.filter(p=>p!==sel);select(null)}
function dup(){if(!sel)return;const{mesh,id,...o}=sel;select(add({...o,pos:[sel.pos[0]+2,sel.pos[1],sel.pos[2]+2],size:[...sel.size]}))}
const RIB={HOME:[['↖','Select',()=>tl('select')],['✥','Move',()=>tl('move')],['⤢','Scale',()=>tl('scale')],['⧉','Duplicate',dup],['🗑','Delete',del]],
 MODEL:TB.map(t=>[t[0],t[1],t[2]]),TEST:[['▶','Play',()=>play()],['■','Stop',()=>stop()],['⬇','Export .rbxlx',()=>exp()]]};
function tl(t){tool=t;rib(curTab);updGizmo();$('#nud').hidden=!sel||t=='select'}
let curTab='HOME';
function rib(k){curTab=k;$('#tabs').innerHTML=Object.keys(RIB).map(n=>`<div class="${n==k?'on':''}" data-k=${n}>${n}</div>`).join('');
 $('#rib').innerHTML=RIB[k].map((b,i)=>`<div class="btn ${k=='HOME'&&b[1].toLowerCase()==tool?'on':''}" data-i=${i}><i>${b[0]}</i>${b[1]}</div>`).join('')}
$('#tabs').onclick=e=>e.target.dataset.k&&rib(e.target.dataset.k);
$('#rib').onclick=e=>{const b=e.target.closest('[data-i]');if(b)RIB[curTab][b.dataset.i][2]()};
$('#nud').innerHTML=['X−','X+','Y−','Y+','Z−','Z+'].map((l,i)=>`<div class=btn data-a=${i>>1} data-s=${i%2?1:-1}>${l}</div>`).join('')+'<div class=btn id=sn>Snap 1</div>';
$('#nud').onclick=e=>{const b=e.target;if(b.id=='sn'){snap=snap==1?2:snap==2?5:snap==5?.5:1;b.textContent='Snap '+snap;return}
 if(b.dataset.a===undefined||!sel)return;const A=tool=='scale'?sel.size:sel.pos,a=+b.dataset.a;A[a]=Math.round((A[a]+b.dataset.s*snap)*100)/100;if(tool=='scale')A[a]=Math.max(.2,A[a]);upd(sel);ui()};
// ---------- Camera & Gizmo Drag Input ----------
const el=R.domElement,P=new Map();let down=null,pd=1,pc=[0,0];
const pinch=()=>{const a=[...P.values()];return a.length>1?Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]):1};
const cen=()=>{const a=[...P.values()];return a.length>1?[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]:[0,0]};
el.onpointerdown=e=>{
 el.setPointerCapture(e.pointerId);
 if(mode=='edit'&&gz.visible&&!P.size){
  const r=el.getBoundingClientRect(),rc=new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),C);
  const h=rc.intersectObjects(gzHits)[0];
  if(h){
   const g=h.object.userData.gz,o=new THREE.Vector3(...sel.pos);
   g.mat.opacity=1;
   drag={id:e.pointerId,g,o,t0:dragT(rc.ray,o,g.dir),p0:[...sel.pos],s0:[...sel.size]};
   return;
  }
 }
 P.set(e.pointerId,[e.clientX,e.clientY]);down={m:0};pd=pinch();pc=cen()
};
el.onpointermove=e=>{
 if(drag&&drag.id===e.pointerId){
  const raw=dragT(ray(e),drag.o,drag.g.dir)-drag.t0;
  const d=snap>0?Math.round(raw/snap)*snap:raw;
  const a=drag.g.a,s=drag.g.s;
  if(tool=='move'){
   sel.pos[a]=Math.round((drag.p0[a]+s*d)*100)/100;
  }else if(tool=='scale'){
   const ns=Math.max(.2,Math.round((drag.s0[a]+d)*100)/100);
   const ad=ns-drag.s0[a];
   sel.size[a]=ns;
   sel.pos[a]=Math.round((drag.p0[a]+s*(ad/2))*100)/100;
  }
  upd(sel);
  if(!$('#prop').hidden)ui();
  return;
 }
 const o=P.get(e.pointerId);if(!o)return;const dx=e.clientX-o[0],dy=e.clientY-o[1];P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size==1){yaw-=dx*.008;pitch=Math.max(.05,Math.min(1.5,pitch+dy*.008));down&&(down.m+=Math.abs(dx)+Math.abs(dy))}
 else if(P.size==2){const d=pinch(),c=cen(),k=dist*.0015;dist=Math.max(5,Math.min(300,dist*pd/d));pd=d;
  if(mode=='edit'){T.x+=-(c[0]-pc[0])*Math.cos(yaw)*k+(c[1]-pc[1])*-Math.sin(yaw)*k;T.z+=(c[0]-pc[0])*Math.sin(yaw)*k+(c[1]-pc[1])*-Math.cos(yaw)*k}pc=c;if(down)down.m=99}cam();updGizmo()};
el.onpointerup=e=>{
 if(drag&&drag.id===e.pointerId){drag.g.mat.opacity=.95;drag=null;ui();return}
 P.delete(e.pointerId);if(down&&down.m<8&&!P.size&&mode=='edit')pick(e);if(!P.size)down=null
};
el.onwheel=e=>{dist=Math.max(5,Math.min(300,dist*(1+e.deltaY*.001)));cam();updGizmo()};
function pick(e){const r=el.getBoundingClientRect(),rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),C);
 const h=rc.intersectObjects(parts.map(p=>p.mesh))[0];select(h?h.object.userData.p:null)}
// ---------- Play mode ----------
let ch,pp=new THREE.Vector3(),vy=0,ground=false,jx=0,jy=0,jump=false,mv=0;const keys={};
function mkChar(){const g=new THREE.Group(),bx=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);g.add(m);return m};
 bx(2,2,1,0x0d69ac,0,3,0);bx(1,2,1,0xf5cd30,-1.5,3,0);bx(1,2,1,0xf5cd30,1.5,3,0);
 const head=bx(1.2,1.2,1.2,0xf5cd30,0,4.6,0);head.material=[0,1,2,3,4,5].map(i=>new THREE.MeshLambertMaterial(i==4&&avTex?{map:avTex}:{color:0xf5cd30}));
 const l=bx(1,2,1,0xa4bd47,-.5,1,0),r=bx(1,2,1,0xa4bd47,.5,1,0);l.geometry.translate(0,0,0);g.userData={l,r};
 const cv=document.createElement('canvas');cv.width=256;cv.height=64;const x=cv.getContext('2d');x.font='bold 34px sans-serif';x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=5;x.textAlign='center';
 const nm=$('#user').value.trim()||'Player';x.strokeText(nm,128,42);x.fillText(nm,128,42);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));sp.scale.set(8,2,1);sp.position.y=6.8;g.add(sp);return g}
function play(){if(mode=='play')return;mode='play';document.body.classList.add('play');$('#bp').hidden=true;$('#bs').hidden=false;
 saved=[T.clone(),yaw,pitch,dist];dist=22;pitch=.4;grid.visible=false;hl.visible=false;gz.visible=false;
 const sp=parts.find(p=>p.spawn);pp.set(sp?sp.pos[0]:0,sp?sp.pos[1]+sp.size[1]/2+.1:5,sp?sp.pos[2]:0);vy=0;
 ch=mkChar();S.add(ch);loadAv().finally(()=>{if(mode=='play'&&avTex){S.remove(ch);ch=mkChar();S.add(ch)}})}
function stop(){if(mode!='play')return;mode='edit';document.body.classList.remove('play');$('#bp').hidden=false;$('#bs').hidden=true;S.remove(ch);
 [T,yaw,pitch,dist]=saved;grid.visible=true;hl.visible=!!sel;updGizmo();cam()}
$('#bp').onclick=play;$('#bs').onclick=stop;
function hit(ax){const H=.9;return parts.some(p=>{if(!p.collide)return false;const[x,y,z]=p.pos,[a,b,c]=p.size;
 if(Math.abs(pp.x-x)>=H+a/2||Math.abs(pp.z-z)>=H+c/2||pp.y>=y+b/2-.05||pp.y+5<=y-b/2+.05)return false;
 if(ax&&y+b/2-pp.y<=1.2&&ground){pp.y=y+b/2;return false}return true})}
function step(dt){const ix=jx+(keys.d?1:0)-(keys.a?1:0),iy=jy+(keys.s?1:0)-(keys.w?1:0),f=[-Math.sin(yaw),-Math.cos(yaw)],r=[Math.cos(yaw),-Math.sin(yaw)];
 let dx=f[0]*-iy+r[0]*ix,dz=f[1]*-iy+r[1]*ix;const L=Math.hypot(dx,dz);if(L>1){dx/=L;dz/=L}
 const s=16*dt;pp.x+=dx*s;if(hit(1))pp.x-=dx*s;pp.z+=dz*s;if(hit(1))pp.z-=dz*s;
 if((jump||keys[' '])&&ground){vy=50;ground=false}vy=Math.max(-150,vy-196*dt);const oy=pp.y;pp.y+=vy*dt;ground=false;
 for(const p of parts){if(!p.collide)continue;const[x,y,z]=p.pos,[a,b,c]=p.size;if(Math.abs(pp.x-x)>=.9+a/2||Math.abs(pp.z-z)>=.9+c/2)continue;
  const top=y+b/2,bot=y-b/2;if(vy<=0&&oy>=top-.01&&pp.y<top){pp.y=top;vy=0;ground=true}else if(vy>0&&oy+5<=bot+.01&&pp.y+5>bot){pp.y=bot-5;vy=0}}
 if(pp.y<-200){const sp=parts.find(p=>p.spawn);pp.set(sp?sp.pos[0]:0,10,sp?sp.pos[2]:0);vy=0}
 ch.position.copy(pp);if(L>.1){ch.rotation.y=Math.atan2(dx,dz);mv+=dt*10}else mv=0;const w=Math.sin(mv)*.8*(ground?1:.3);ch.userData.l.rotation.x=w;ch.userData.r.rotation.x=-w;
 T.set(pp.x,pp.y+3,pp.z);cam()}
const joy=$('#joy'),kn=$('#knob');
function jm(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-55)/45,y=(e.clientY-r.top-55)/45;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}jx=x;jy=y;kn.style.transform=`translate(${x*35}px,${y*35}px)`}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);jm(e);joy.dn=1};joy.onpointermove=e=>joy.dn&&jm(e);joy.onpointerup=()=>{joy.dn=0;jx=jy=0;kn.style.transform=''};

async function loadAv(){const n=$('#user').value.trim();if(!n)return;try{
 const u=await(await fetch('https://users.roblox.com/v1/usernames/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usernames:[n],excludeBannedUsers:true})})).json();
 if(!u.data||!u.data[0])return toast('Username not found');
 const t=await(await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${u.data[0].id}&size=150x150&format=Png`)).json();
 const L=new THREE.TextureLoader();L.setCrossOrigin('anonymous');avTex=await new Promise((ok,no)=>L.load(t.data[0].imageUrl,ok,undefined,no));toast('Avatar loaded for '+n)}
 catch(e){toast('Could not reach Roblox (browser CORS) — default avatar used')}}
$('#user').onchange=()=>{avTex=null;loadAv()};
// ---------- Export .rbxlx ----------
function xml(){let n=0;const rf=()=>'RBX'+(++n).toString(16).toUpperCase().padStart(32,'0'),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const part=p=>{const[x,y,z]=p.pos,[a,b,c]=p.size,col=4278190080+parseInt(p.color.slice(1),16);
  return `<Item class="${p.spawn?'SpawnLocation':'Part'}" referent="${rf()}"><Properties><string name="Name">${E(p.name)}</string><bool name="Anchored">${p.anchored}</bool><bool name="CanCollide">${p.collide}</bool><float name="Transparency">${p.transp}</float><token name="shape">${{ball:0,block:1,cyl:2}[p.shape]}</token><Color3uint8 name="Color3uint8">${col}</Color3uint8><Vector3 name="size"><X>${a}</X><Y>${b}</Y><Z>${c}</Z></Vector3><CoordinateFrame name="CFrame"><X>${x}</X><Y>${y}</Y><Z>${z}</Z><R00>1</R00><R01>0</R01><R02>0</R02><R10>0</R10><R11>1</R11><R12>0</R12><R20>0</R20><R21>0</R21><R22>1</R22></CoordinateFrame></Properties></Item>`};
 const M={};let body='';parts.forEach(p=>p.model?(M[p.model]=M[p.model]||[]).push(p):body+=part(p));
 for(const k in M)body+=`<Item class="Model" referent="${rf()}"><Properties><string name="Name">${E(k)}</string></Properties>${M[k].map(part).join('')}</Item>`;
 return `<?xml version="1.0" encoding="utf-8"?>
<roblox version="4"><Item class="Workspace" referent="${rf()}"><Properties><string name="Name">Workspace</string></Properties>${body}</Item><Item class="Lighting" referent="${rf()}"><Properties><string name="Name">Lighting</string></Properties></Item></roblox>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml()],{type:'application/xml'}));a.download='Place1.rbxlx';a.click();toast('Exported Place1.rbxlx')}
